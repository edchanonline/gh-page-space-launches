name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'electron-launches.py'
      - 'docs/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install marimo
      
      - name: Export marimo app
        run: |
          mkdir -p docs
          marimo export html-wasm electron-launches.py -o docs --mode run

      - name: Patch locale bug in exported HTML
        run: |
          # Inject a script to sanitize navigator.language before marimo's react-aria
          # loads it. Browsers on some Linux systems return "en-US@posix" which is an
          # invalid BCP 47 tag and causes `new Intl.Locale()` to throw a RangeError,
          # crashing the entire marimo app. Strip the POSIX @-extension if present.
          PATCH='<script>\n  (function() {\n    var lang = navigator.language || "";\n    if (lang && lang.indexOf("@") !== -1) {\n      var sanitized = lang.split("@")[0];\n      try { new Intl.Locale(sanitized); }\n      catch(e) { sanitized = "en-US"; }\n      Object.defineProperty(navigator, "language", { get: function() { return sanitized; } });\n    }\n  })();\n</script>'
          python3 -c "
import re, sys
with open('docs/index.html', 'r') as f:
    html = f.read()
# Insert before the first <script type=\"module\"> which loads marimo
patched = html.replace(
    '<script type=\"module\" crossorigin src=',
    '<script>\n  (function() {\n    var lang = navigator.language || \"\";\n    if (lang && lang.indexOf(\"@\") !== -1) {\n      var sanitized = lang.split(\"@\")[0];\n      try { new Intl.Locale(sanitized); } catch(e) { sanitized = \"en-US\"; }\n      Object.defineProperty(navigator, \"language\", { get: function() { return sanitized; } });\n    }\n  })();\n</script>\n    <script type=\"module\" crossorigin src=',
    1  # only replace first occurrence
)
if patched == html:
    print('WARNING: injection point not found in index.html', file=sys.stderr)
    sys.exit(1)
with open('docs/index.html', 'w') as f:
    f.write(patched)
print('Locale patch injected successfully')
"

      - name: Ensure CNAME exists
        run: |
          if [ ! -f "docs/CNAME" ]; then
            echo "electron-launches.talknewspace.com" > docs/CNAME
          fi
      
      - name: Create .nojekyll file
        run: |
          touch docs/.nojekyll
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
